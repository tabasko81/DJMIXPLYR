<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Player Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #333;
        }

        .player-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
        }

        .player-header {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .player-header h1 {
            font-size: 20px;
            font-weight: 300;
            color: #667eea;
            margin: 0;
        }

        .player-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .playlist-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }

        .playlist-section h2 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #555;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .track-item:hover {
            background: rgba(102, 126, 234, 0.15);
            transform: translateX(5px);
        }

        .track-item.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .track-cover {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            margin-right: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .track-info {
            flex: 1;
            min-width: 0;
        }

        .track-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls-section {
            padding: 15px 20px;
            background: rgba(102, 126, 234, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .now-playing {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .now-playing-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            flex-shrink: 0;
        }

        .now-playing-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .now-playing-info {
            flex: 1;
            min-width: 0;
        }

        .now-playing-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-artist {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .control-btn {
            background: #667eea;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .control-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.play-pause {
            width: 50px;
            height: 50px;
            font-size: 20px;
        }

        .progress-container {
            flex: 1;
            position: relative;
            height: 6px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 3px;
            cursor: pointer;
            margin: 0 10px;
        }

        .progress-bar {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            font-size: 11px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .volume-slider {
            width: 100px;
            height: 4px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 15px;
        }

        audio {
            display: none;
        }

        @media (max-width: 768px) {
            .controls-section {
                padding: 12px 15px;
            }

            .playlist-section {
                padding: 12px;
            }

            .now-playing-cover {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .control-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .control-btn.play-pause {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }

        /* Scrollbar styling */
        .playlist-section::-webkit-scrollbar {
            width: 8px;
        }

        .playlist-section::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        .playlist-section::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .playlist-section::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <h1>🎵 MP3 Player</h1>
        </div>

        <div class="controls-section">
            <div class="now-playing">
                <div class="now-playing-cover" id="nowPlayingCover">
                    🎵
                </div>
                <div class="now-playing-info">
                    <div class="now-playing-title" id="nowPlayingTitle">Select a track</div>
                    <div class="now-playing-artist" id="nowPlayingArtist">—</div>
                </div>
            </div>

            <div class="audio-controls">
                <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
                <button class="control-btn play-pause" id="playPauseBtn" title="Play/Pause">▶</button>
                <button class="control-btn" id="nextBtn" title="Next">⏭</button>
                
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>

            <div class="volume-control">
                <span>🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                <span id="volumeValue">100%</span>
            </div>
        </div>

        <div class="player-main">
            <div class="playlist-section">
                <h2>Playlist</h2>
                <div id="playlist" class="playlist">
                    <!-- Tracks will be inserted here by update_player.py -->
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        // PLAYLIST_DATA will be replaced by update_player.py
        const PLAYLIST_DATA = []

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingArtist = document.getElementById('nowPlayingArtist');
        const nowPlayingCover = document.getElementById('nowPlayingCover');
        const playlist = document.getElementById('playlist');

        let currentTrackIndex = -1;

        // Render playlist
        function renderPlaylist() {
            if (PLAYLIST_DATA.length === 0) {
                playlist.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎵</div>
                        <p>No tracks found</p>
                        <p style="margin-top: 10px; font-size: 12px;">Run update_player.py to add MP3 files</p>
                    </div>
                `;
                return;
            }

            playlist.innerHTML = PLAYLIST_DATA.map((track, index) => `
                <div class="track-item ${index === currentTrackIndex ? 'active' : ''}" 
                     data-index="${index}" 
                     onclick="playTrack(${index})">
                    <div class="track-cover">
                        ${track.cover ? `<img src="${track.cover}" alt="Cover">` : '🎵'}
                    </div>
                    <div class="track-info">
                        <div class="track-title">${track.title || track.filename}</div>
                        <div class="track-artist">${track.artist || 'Unknown Artist'}</div>
                    </div>
                </div>
            `).join('');
        }

        // Format time
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Load and play track
        function playTrack(index) {
            if (index < 0 || index >= PLAYLIST_DATA.length) return;

            currentTrackIndex = index;
            const track = PLAYLIST_DATA[index];
            
            audioPlayer.src = track.path;
            audioPlayer.load();
            audioPlayer.play();

            updateNowPlaying(track);
            updatePlaylistUI();
        }

        // Update current track information
        function updateNowPlaying(track) {
            nowPlayingTitle.textContent = track.title || track.filename;
            nowPlayingArtist.textContent = track.artist || 'Unknown Artist';
            
            if (track.cover) {
                nowPlayingCover.innerHTML = `<img src="${track.cover}" alt="Cover">`;
            } else {
                nowPlayingCover.innerHTML = '🎵';
            }
        }

        // Update playlist UI
        function updatePlaylistUI() {
            document.querySelectorAll('.track-item').forEach((item, index) => {
                if (index === currentTrackIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                if (currentTrackIndex === -1 && PLAYLIST_DATA.length > 0) {
                    playTrack(0);
                } else {
                    audioPlayer.play();
                }
            } else {
                audioPlayer.pause();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (PLAYLIST_DATA.length === 0) return;
            const newIndex = currentTrackIndex <= 0 ? PLAYLIST_DATA.length - 1 : currentTrackIndex - 1;
            playTrack(newIndex);
        });

        nextBtn.addEventListener('click', () => {
            if (PLAYLIST_DATA.length === 0) return;
            const newIndex = currentTrackIndex >= PLAYLIST_DATA.length - 1 ? 0 : currentTrackIndex + 1;
            playTrack(newIndex);
        });

        // Atualizar progresso
        audioPlayer.addEventListener('timeupdate', () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressBar.style.width = progress + '%';
            currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
        });

        audioPlayer.addEventListener('loadedmetadata', () => {
            durationDisplay.textContent = formatTime(audioPlayer.duration);
        });

        // Seek
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = pos * audioPlayer.duration;
        });

        // Volume
        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            audioPlayer.volume = volume;
            volumeValue.textContent = e.target.value + '%';
        });

        // Atualizar botão play/pause
        audioPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
        });

        audioPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
        });

        // Next track when finished
        audioPlayer.addEventListener('ended', () => {
            if (PLAYLIST_DATA.length > 0) {
                const newIndex = currentTrackIndex >= PLAYLIST_DATA.length - 1 ? 0 : currentTrackIndex + 1;
                playTrack(newIndex);
            }
        });

        // Make playTrack global for onclick
        window.playTrack = playTrack;

        // Initialize
        renderPlaylist();
    </script>
</body>
</html>
